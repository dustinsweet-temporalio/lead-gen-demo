[project]
name = "durable-lead-intake"
version = "0.1.0"
description = "Durable lead-intake AI agent demo — four variants from no-Temporal to fully orchestrated (gpt-5.5)"
requires-python = ">=3.11"

# Versions below are the ones installed and verified for this demo (Python 3.14, macOS).
# Re-pin if you upgrade; the integration API surface is sensitive across minor versions.
dependencies = [
    "temporalio[openai-agents]==1.28.0",  # Temporal SDK + OpenAI Agents contrib
    "openai-agents==0.17.5",              # OpenAI Agents SDK
    "openai>=1.50",                       # AsyncOpenAI client (structured-output parse)
    "opentelemetry-api==1.42.1",          # required by the openai_agents contrib tracer
    "opentelemetry-sdk==1.42.1",
    "fastapi==0.137.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "tiktoken==0.13.0",                   # token fallback estimator
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
